# LEGO Factory v3 - Mosquitto MQTT Broker Configuration

# =============================================================================
# Listeners
# =============================================================================
listener 1883
protocol mqtt

listener 9001
protocol websockets

# =============================================================================
# Security (Development - Allow Anonymous)
# =============================================================================
allow_anonymous true

# For production, use:
# allow_anonymous false
# password_file /mosquitto/config/passwd

# =============================================================================
# Persistence
# =============================================================================
persistence true
persistence_location /mosquitto/data/

# =============================================================================
# Logging
# =============================================================================
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
