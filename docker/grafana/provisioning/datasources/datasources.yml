# Grafana Datasources Configuration
# ==================================
# This file is provisioned at startup.
# Environment variables are passed from docker-compose.yml
#
# Required environment variables:
#   - POSTGRES_USER: PostgreSQL username (default: lego)
#   - POSTGRES_PASSWORD: PostgreSQL password (required)

apiVersion: 1

datasources:
  - name: PostgreSQL
    type: postgres
    url: postgres:5432
    database: lego_factory
    user: ${POSTGRES_USER:-lego}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1500
      timescaledb: true
    isDefault: true
    editable: true

  - name: Redis
    type: redis-datasource
    url: redis:6379
    jsonData:
      client: standalone
    editable: true
