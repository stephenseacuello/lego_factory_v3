apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: lego-factory
  labels:
    app.kubernetes.io/name: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager:9093

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # LEGO Factory application metrics
      - job_name: 'lego-factory-app'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - lego-factory
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      # PostgreSQL/TimescaleDB metrics
      - job_name: 'postgres'
        static_configs:
          - targets: ['postgres-service:9187']
        metrics_path: /metrics

      # Redis metrics
      - job_name: 'redis'
        static_configs:
          - targets: ['redis-service:9121']

      # Node metrics
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

  alerts.yml: |
    groups:
      - name: lego-factory-alerts
        rules:
          # High error rate
          - alert: HighErrorRate
            expr: sum(rate(lego_factory_http_requests_total{status_code=~"5.."}[5m])) / sum(rate(lego_factory_http_requests_total[5m])) > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "High error rate detected"
              description: "Error rate is above 5% for the last 5 minutes"

          # High latency
          - alert: HighLatency
            expr: histogram_quantile(0.95, sum(rate(lego_factory_http_request_duration_seconds_bucket[5m])) by (le, endpoint)) > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High latency detected"
              description: "95th percentile latency is above 2 seconds"

          # Pod memory usage
          - alert: HighMemoryUsage
            expr: container_memory_usage_bytes{namespace="lego-factory"} / container_spec_memory_limit_bytes{namespace="lego-factory"} > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage"
              description: "Pod memory usage is above 85%"

          # Active alarms critical
          - alert: CriticalAlarmsActive
            expr: lego_factory_active_alarms{priority="1"} > 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Critical SCADA alarms active"
              description: "There are {{ $value }} critical alarms active"

          # ML anomaly detection
          - alert: MLAnomalyDetected
            expr: increase(lego_factory_anomaly_detections_total[5m]) > 3
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Multiple ML anomalies detected"
              description: "More than 3 anomalies detected in the last 5 minutes"

          # Open NCRs critical
          - alert: CriticalNCRsOpen
            expr: lego_factory_open_ncrs{severity="critical"} > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Critical NCRs open"
              description: "There are {{ $value }} critical NCRs open"

          # Historian buffer full
          - alert: HistorianBufferHigh
            expr: lego_factory_historian_buffer_size > 8000
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Historian buffer getting full"
              description: "Historian buffer size is {{ $value }}"

          # Database connection issues
          - alert: DatabaseConnectionFailed
            expr: pg_up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Database connection failed"
              description: "Cannot connect to PostgreSQL database"

          # Robot connection lost
          - alert: RobotConnectionLost
            expr: lego_factory_robot_connections == 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "No robots connected"
              description: "All robot connections have been lost"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: lego-factory
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus-sa
      containers:
        - name: prometheus
          image: prom/prometheus:v2.47.0
          ports:
            - containerPort: 9090
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=30d
            - --web.enable-lifecycle
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: storage
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: lego-factory
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
  selector:
    app: prometheus
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-sa
  namespace: lego-factory
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-role
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-role
subjects:
  - kind: ServiceAccount
    name: prometheus-sa
    namespace: lego-factory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: lego-factory
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
