apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: lego-factory
  labels:
    app.kubernetes.io/name: grafana
data:
  lego-factory-overview.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": 1,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.0.0",
          "targets": [
            {
              "expr": "sum(rate(lego_factory_http_requests_total[5m]))",
              "refId": "A"
            }
          ],
          "title": "Requests/sec",
          "type": "stat"
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(lego_factory_http_request_duration_seconds_bucket[5m])) by (le))",
              "refId": "A"
            }
          ],
          "title": "P95 Latency (s)",
          "type": "stat"
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area"
          },
          "targets": [
            {
              "expr": "sum(lego_factory_active_alarms)",
              "refId": "A"
            }
          ],
          "title": "Active Alarms",
          "type": "stat"
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area"
          },
          "targets": [
            {
              "expr": "lego_factory_robot_connections",
              "refId": "A"
            }
          ],
          "title": "Connected Robots",
          "type": "stat"
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "id": 5,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "single" }
          },
          "targets": [
            {
              "expr": "sum(rate(lego_factory_http_requests_total[5m])) by (endpoint)",
              "legendFormat": "{{ endpoint }}",
              "refId": "A"
            }
          ],
          "title": "Request Rate by Endpoint",
          "type": "timeseries"
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "id": 6,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(lego_factory_http_request_duration_seconds_bucket[5m])) by (le, endpoint))",
              "legendFormat": "{{ endpoint }}",
              "refId": "A"
            }
          ],
          "title": "Latency by Endpoint (P95)",
          "type": "timeseries"
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "id": 7,
          "targets": [
            {
              "expr": "sum(rate(lego_factory_http_requests_total{status_code=~\"5..\"}[5m])) / sum(rate(lego_factory_http_requests_total[5m])) * 100",
              "legendFormat": "Error Rate %",
              "refId": "A"
            }
          ],
          "title": "Error Rate (%)",
          "type": "timeseries"
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "id": 8,
          "targets": [
            {
              "expr": "lego_factory_http_requests_in_progress",
              "legendFormat": "{{ method }} {{ endpoint }}",
              "refId": "A"
            }
          ],
          "title": "Requests In Progress",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["lego-factory", "overview"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "LEGO Factory - Overview",
      "uid": "lego-factory-overview",
      "version": 1
    }

  scada-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "id": 2,
      "panels": [
        {
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "targets": [
            { "expr": "lego_factory_historian_buffer_size", "refId": "A" }
          ],
          "title": "Historian Buffer Size",
          "type": "stat"
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "targets": [
            { "expr": "lego_factory_historian_compression_ratio", "refId": "A" }
          ],
          "title": "Compression Ratio",
          "type": "stat"
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "targets": [
            { "expr": "sum(lego_factory_active_alarms{priority=\"1\"})", "refId": "A" }
          ],
          "title": "Critical Alarms",
          "type": "stat",
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "targets": [
            { "expr": "sum(rate(lego_factory_scada_tag_writes_total[5m]))", "refId": "A" }
          ],
          "title": "Tag Writes/sec",
          "type": "stat"
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "id": 5,
          "targets": [
            {
              "expr": "sum(lego_factory_active_alarms) by (priority)",
              "legendFormat": "Priority {{ priority }}",
              "refId": "A"
            }
          ],
          "title": "Active Alarms by Priority",
          "type": "timeseries"
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "id": 6,
          "targets": [
            {
              "expr": "sum(rate(lego_factory_alarm_events_total[5m])) by (event_type)",
              "legendFormat": "{{ event_type }}",
              "refId": "A"
            }
          ],
          "title": "Alarm Events Rate",
          "type": "timeseries"
        },
        {
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 12 },
          "id": 7,
          "targets": [
            {
              "expr": "lego_factory_scada_tag_value",
              "legendFormat": "{{ tag_name }}",
              "refId": "A"
            }
          ],
          "title": "Tag Values",
          "type": "timeseries"
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "tags": ["lego-factory", "scada"],
      "title": "LEGO Factory - SCADA",
      "uid": "lego-factory-scada",
      "version": 1
    }

  ml-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "id": 3,
      "panels": [
        {
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "targets": [
            { "expr": "sum(rate(lego_factory_ml_inference_total[5m]))", "refId": "A" }
          ],
          "title": "Inferences/sec",
          "type": "stat"
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(lego_factory_ml_inference_duration_seconds_bucket[5m])) by (le))", "refId": "A" }
          ],
          "title": "Inference Latency (P95)",
          "type": "stat"
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "targets": [
            { "expr": "sum(increase(lego_factory_anomaly_detections_total[1h]))", "refId": "A" }
          ],
          "title": "Anomalies (1h)",
          "type": "stat"
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "targets": [
            { "expr": "avg(lego_factory_ml_anomaly_score)", "refId": "A" }
          ],
          "title": "Avg Anomaly Score",
          "type": "stat"
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "id": 5,
          "targets": [
            {
              "expr": "lego_factory_ml_anomaly_score",
              "legendFormat": "{{ tag_id }}",
              "refId": "A"
            }
          ],
          "title": "Anomaly Scores by Tag",
          "type": "timeseries"
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "id": 6,
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(lego_factory_ml_inference_duration_seconds_bucket[5m])) by (le, model_name))",
              "legendFormat": "{{ model_name }}",
              "refId": "A"
            }
          ],
          "title": "Inference Latency by Model",
          "type": "timeseries"
        },
        {
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 12 },
          "id": 7,
          "targets": [
            {
              "expr": "sum(rate(lego_factory_anomaly_detections_total[5m])) by (severity)",
              "legendFormat": "{{ severity }}",
              "refId": "A"
            }
          ],
          "title": "Anomaly Detection Rate by Severity",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "tags": ["lego-factory", "ml"],
      "title": "LEGO Factory - ML Inference",
      "uid": "lego-factory-ml",
      "version": 1
    }

  qms-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "id": 4,
      "panels": [
        {
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "targets": [
            { "expr": "sum(lego_factory_open_ncrs)", "refId": "A" }
          ],
          "title": "Open NCRs",
          "type": "stat"
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "targets": [
            { "expr": "lego_factory_open_ncrs{severity=\"critical\"}", "refId": "A" }
          ],
          "title": "Critical NCRs",
          "type": "stat",
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "targets": [
            { "expr": "sum(lego_factory_open_capas)", "refId": "A" }
          ],
          "title": "Open CAPAs",
          "type": "stat"
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "targets": [
            { "expr": "sum(rate(lego_factory_ncr_events_total[24h]))", "refId": "A" }
          ],
          "title": "NCR Events (24h)",
          "type": "stat"
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "id": 5,
          "targets": [
            {
              "expr": "lego_factory_open_ncrs",
              "legendFormat": "{{ severity }}",
              "refId": "A"
            }
          ],
          "title": "Open NCRs by Severity",
          "type": "piechart"
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "id": 6,
          "targets": [
            {
              "expr": "lego_factory_open_capas",
              "legendFormat": "{{ capa_type }}",
              "refId": "A"
            }
          ],
          "title": "Open CAPAs by Type",
          "type": "piechart"
        },
        {
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 12 },
          "id": 7,
          "targets": [
            {
              "expr": "sum(rate(lego_factory_ncr_events_total[5m])) by (event_type)",
              "legendFormat": "{{ event_type }}",
              "refId": "A"
            }
          ],
          "title": "NCR Events Over Time",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 38,
      "tags": ["lego-factory", "qms"],
      "title": "LEGO Factory - QMS",
      "uid": "lego-factory-qms",
      "version": 1
    }

  robotics-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "id": 5,
      "panels": [
        {
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "targets": [
            { "expr": "lego_factory_robot_connections", "refId": "A" }
          ],
          "title": "Connected Robots",
          "type": "stat"
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "targets": [
            { "expr": "sum(rate(lego_factory_robot_commands_total[5m]))", "refId": "A" }
          ],
          "title": "Commands/sec",
          "type": "stat"
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "targets": [
            { "expr": "sum(increase(lego_factory_robot_errors_total[1h]))", "refId": "A" }
          ],
          "title": "Errors (1h)",
          "type": "stat"
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "targets": [
            { "expr": "lego_factory_work_orders_active", "refId": "A" }
          ],
          "title": "Active Work Orders",
          "type": "stat"
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "id": 5,
          "targets": [
            {
              "expr": "sum(rate(lego_factory_robot_commands_total[5m])) by (robot_id, command_type)",
              "legendFormat": "{{ robot_id }} - {{ command_type }}",
              "refId": "A"
            }
          ],
          "title": "Robot Commands Rate",
          "type": "timeseries"
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "id": 6,
          "targets": [
            {
              "expr": "sum(rate(lego_factory_robot_errors_total[5m])) by (robot_id, error_type)",
              "legendFormat": "{{ robot_id }} - {{ error_type }}",
              "refId": "A"
            }
          ],
          "title": "Robot Errors Rate",
          "type": "timeseries"
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "id": 7,
          "targets": [
            {
              "expr": "sum(rate(lego_factory_parts_produced_total[5m])) by (product_type)",
              "legendFormat": "{{ product_type }}",
              "refId": "A"
            }
          ],
          "title": "Parts Production Rate",
          "type": "timeseries"
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "id": 8,
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(lego_factory_work_order_completion_seconds_bucket[1h])) by (le))",
              "legendFormat": "P95 Completion Time",
              "refId": "A"
            }
          ],
          "title": "Work Order Completion Time",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "tags": ["lego-factory", "robotics"],
      "title": "LEGO Factory - Robotics",
      "uid": "lego-factory-robotics",
      "version": 1
    }
