# =============================================================================
# LEGO Factory v3 - Kubernetes Secrets Template
# =============================================================================
# WARNING: This is a TEMPLATE file. Do NOT deploy with placeholder values.
#
# Instructions for production:
# 1. Copy this file to secrets-production.yaml (gitignored)
# 2. Replace ALL placeholder values with secure random strings
# 3. Generate secrets with: python -c "import secrets; print(secrets.token_urlsafe(32))"
# 4. Apply with: kubectl apply -f secrets-production.yaml
#
# For production, consider using:
# - HashiCorp Vault
# - AWS Secrets Manager
# - Azure Key Vault
# - Sealed Secrets
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: lego-factory-secrets
  namespace: lego-factory
  labels:
    app.kubernetes.io/name: lego-factory
  annotations:
    description: "Application secrets - values must be replaced before deployment"
type: Opaque
stringData:
  # Database credentials - MUST REPLACE
  DATABASE_USER: "${DATABASE_USER}"
  DATABASE_PASSWORD: "${DATABASE_PASSWORD}"

  # Redis password - MUST REPLACE
  REDIS_PASSWORD: "${REDIS_PASSWORD}"

  # Flask secret key (32+ chars) - MUST REPLACE
  SECRET_KEY: "${SECRET_KEY}"

  # JWT secret (32+ chars) - MUST REPLACE
  JWT_SECRET_KEY: "${JWT_SECRET_KEY}"

  # API keys for external services - MUST REPLACE
  SLICER_API_KEY: "${SLICER_API_KEY}"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: lego-factory
  annotations:
    description: "PostgreSQL credentials - values must be replaced before deployment"
type: Opaque
stringData:
  POSTGRES_USER: "${POSTGRES_USER}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  POSTGRES_DB: "lego_factory"
