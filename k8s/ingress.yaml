apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lego-factory-ingress
  namespace: lego-factory
  labels:
    app.kubernetes.io/name: lego-factory
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
    - hosts:
        - lego-factory.example.com
      secretName: lego-factory-tls
  rules:
    - host: lego-factory.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: lego-factory-service
                port:
                  number: 80
          - path: /health
            pathType: Exact
            backend:
              service:
                name: lego-factory-service
                port:
                  number: 80
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: lego-factory-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lego-factory-frontend
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lego-factory-network-policy
  namespace: lego-factory
spec:
  podSelector:
    matchLabels:
      app: lego-factory-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 5000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: mosquitto
      ports:
        - protocol: TCP
          port: 1883
