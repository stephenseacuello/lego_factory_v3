apiVersion: v1
kind: ConfigMap
metadata:
  name: lego-factory-config
  namespace: lego-factory
  labels:
    app.kubernetes.io/name: lego-factory
data:
  # Flask Configuration
  FLASK_ENV: "production"
  FLASK_DEBUG: "0"

  # Database Configuration
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "lego_factory"

  # Redis Configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  # MQTT Configuration
  MQTT_BROKER_HOST: "mosquitto-service"
  MQTT_BROKER_PORT: "1883"

  # ROS2 Bridge Configuration
  ROS2_BRIDGE_HOST: "ros2-bridge-service"
  ROS2_BRIDGE_PORT: "9090"

  # Historian Configuration
  HISTORIAN_BUFFER_SIZE: "10000"
  HISTORIAN_FLUSH_INTERVAL: "1.0"
  HISTORIAN_COMPRESSION_DEVIATION: "0.01"

  # ML Inference Configuration
  ML_DEVICE: "cpu"
  ML_BATCH_SIZE: "1"
  ML_ANOMALY_THRESHOLD: "0.7"

  # Logging
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
