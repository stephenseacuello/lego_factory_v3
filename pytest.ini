[pytest]
# LEGO Factory v3 - Pytest Configuration
# =======================================

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (require database or external services)
    e2e: End-to-end tests (require full system running)
    slow: Slow tests (excluded by default with -m "not slow")
    asyncio: Async tests requiring event loop
    smoke: Quick smoke tests for basic functionality
    regression: Regression tests for previously fixed bugs
    security: Security-related tests
    performance: Performance and load tests
    database: Tests that require database access
    api: API endpoint tests
    scada: SCADA-specific tests
    mes: MES-specific tests
    erp: ERP-specific tests
    ml: Machine learning model tests

# Async mode
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Output formatting
addopts =
    -v
    --tb=short
    --strict-markers
    -ra
    --color=yes
    --durations=10
    --durations-min=1.0

# Console output
console_output_style = progress

# Timeout for slow tests (requires pytest-timeout)
timeout = 30
timeout_method = signal

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# Logging configuration
log_cli = false
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s:%(lineno)d: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Environment variables
env =
    FLASK_ENV=testing
    TESTING=true
    DATABASE_URL=sqlite:///:memory:

# Parallel execution (requires pytest-xdist)
# Use: pytest -n auto for automatic parallelization
# addopts = -n auto  # Uncomment to enable by default

# Coverage (when running with pytest-cov)
# Run with: pytest --cov=app --cov=api --cov=services --cov=models --cov-report=html --cov-report=term-missing
