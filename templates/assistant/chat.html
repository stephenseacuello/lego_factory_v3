<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNC SCADA Assistant - Claude AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/marked/marked.min.js" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #64748b;
            --success-color: #22c55e;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
        }

        .chat-header {
            background: linear-gradient(135deg, var(--primary-color), #1d4ed8);
            color: white;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h1 {
            font-size: 1.25rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success-color);
            animation: pulse 2s infinite;
        }

        .status-dot.offline {
            background: var(--danger-color);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .quick-actions {
            padding: 0.75rem 1rem;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .quick-action-btn {
            padding: 0.375rem 0.75rem;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            background: white;
            font-size: 0.813rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-action-btn:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .quick-action-btn.emergency {
            border-color: var(--danger-color);
            color: var(--danger-color);
        }

        .quick-action-btn.emergency:hover {
            background: var(--danger-color);
            color: white;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 85%;
            padding: 1rem;
            border-radius: 1rem;
            position: relative;
        }

        .message.user {
            align-self: flex-end;
            background: var(--primary-color);
            color: white;
            border-bottom-right-radius: 0.25rem;
        }

        .message.assistant {
            align-self: flex-start;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 0.25rem;
        }

        .message.assistant.success {
            border-left: 4px solid var(--success-color);
        }

        .message.assistant.warning {
            border-left: 4px solid var(--warning-color);
        }

        .message.assistant.error {
            border-left: 4px solid var(--danger-color);
        }

        .message-content {
            line-height: 1.5;
        }

        .message-content pre {
            background: rgba(0,0,0,0.1);
            padding: 0.75rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            font-size: 0.875rem;
        }

        .message-content code {
            background: rgba(0,0,0,0.1);
            padding: 0.125rem 0.375rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
        }

        .message-content h2 {
            font-size: 1.125rem;
            margin-top: 0;
            margin-bottom: 0.75rem;
        }

        .message-content h3 {
            font-size: 1rem;
            margin-top: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .message-content ul, .message-content ol {
            padding-left: 1.5rem;
            margin: 0.5rem 0;
        }

        .message-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .message-action-btn {
            padding: 0.375rem 0.75rem;
            border-radius: 0.375rem;
            border: none;
            cursor: pointer;
            font-size: 0.813rem;
            transition: all 0.2s;
        }

        .message-action-btn.confirm {
            background: var(--success-color);
            color: white;
        }

        .message-action-btn.cancel {
            background: var(--secondary-color);
            color: white;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 1rem;
            background: var(--bg-color);
            border-radius: 1rem;
            border: 1px solid var(--border-color);
        }

        .typing-indicator.visible {
            display: flex;
        }

        .typing-dots {
            display: flex;
            gap: 0.25rem;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--secondary-color);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        .chat-input-container {
            padding: 1rem 1.5rem;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
        }

        .chat-input-wrapper {
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 1.5rem;
            resize: none;
            max-height: 150px;
            font-size: 0.938rem;
            line-height: 1.5;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: var(--primary-color);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .send-btn:hover {
            background: #1d4ed8;
            transform: scale(1.05);
        }

        .send-btn:disabled {
            background: var(--secondary-color);
            cursor: not-allowed;
            transform: none;
        }

        .welcome-message {
            text-align: center;
            padding: 2rem;
            color: var(--secondary-color);
        }

        .welcome-message h2 {
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        .welcome-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 1.5rem;
        }

        .suggestion-btn {
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-color);
        }

        /* Voice button */
        .voice-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: white;
            color: var(--secondary-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .voice-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .voice-btn.recording {
            background: var(--danger-color);
            border-color: var(--danger-color);
            color: white;
            animation: pulse 1s infinite;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <h1>
                <i class="fas fa-robot"></i>
                CNC SCADA Assistant
            </h1>
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connected</span>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <button class="quick-action-btn" onclick="sendQuickAction('What\\'s the machine status?')">
                📊 Status
            </button>
            <button class="quick-action-btn emergency" onclick="sendQuickAction('feed hold')">
                🔴 Feed Hold
            </button>
            <button class="quick-action-btn" onclick="sendQuickAction('resume')">
                ▶️ Resume
            </button>
            <button class="quick-action-btn" onclick="sendQuickAction('predict quality')">
                📈 Quality
            </button>
            <button class="quick-action-btn" onclick="sendQuickAction('check machine health')">
                🏥 Health
            </button>
            <button class="quick-action-btn" onclick="sendQuickAction('help')">
                ❓ Help
            </button>
        </div>

        <!-- Messages -->
        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message" id="welcomeMessage">
                <h2>👋 Welcome to CNC SCADA Assistant</h2>
                <p>I'm your AI-powered manufacturing assistant. Ask me about machine status, diagnostics, quality predictions, or G-code analysis.</p>
                <div class="welcome-suggestions">
                    <button class="suggestion-btn" onclick="sendQuickAction('What\\'s the machine status?')">
                        What's the machine doing?
                    </button>
                    <button class="suggestion-btn" onclick="sendQuickAction('Show me the SPC data')">
                        Show SPC analysis
                    </button>
                    <button class="suggestion-btn" onclick="sendQuickAction('diagnose alarm 2')">
                        Help with an alarm
                    </button>
                    <button class="suggestion-btn" onclick="sendQuickAction('What can you help me with?')">
                        What can you do?
                    </button>
                </div>
            </div>

            <!-- Typing indicator -->
            <div class="typing-indicator" id="typingIndicator">
                <div class="typing-dots">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <textarea
                    class="chat-input"
                    id="chatInput"
                    placeholder="Ask about machine status, quality, diagnostics..."
                    rows="1"
                    onkeydown="handleKeyDown(event)"
                    oninput="autoResize(this)"
                ></textarea>
                <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()" title="Voice input">
                    <i class="fas fa-microphone"></i>
                </button>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // Session and Socket.IO setup
        let sessionId = localStorage.getItem('assistantSessionId') || generateSessionId();
        localStorage.setItem('assistantSessionId', sessionId);

        const socket = io({
            transports: ['websocket', 'polling']
        });

        // Socket.IO event handlers
        socket.on('connect', () => {
            console.log('Connected to server');
            socket.emit('assistant_join', { session_id: sessionId });
            updateStatus(true);
        });

        socket.on('disconnect', () => {
            console.log('Disconnected from server');
            updateStatus(false);
        });

        socket.on('assistant_response', (data) => {
            hideTyping();
            addAssistantMessage(data);
        });

        socket.on('assistant_typing', (data) => {
            if (data.typing) {
                showTyping();
            } else {
                hideTyping();
            }
        });

        socket.on('assistant_error', (data) => {
            hideTyping();
            addAssistantMessage({
                text: `Error: ${data.error}`,
                type: 'error'
            });
        });

        // UI Functions
        function generateSessionId() {
            return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function updateStatus(connected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if (connected) {
                dot.classList.remove('offline');
                text.textContent = 'Connected';
            } else {
                dot.classList.add('offline');
                text.textContent = 'Offline';
            }
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();

            if (!message) return;

            // Hide welcome message
            document.getElementById('welcomeMessage').style.display = 'none';

            // Add user message to chat
            addUserMessage(message);

            // Send via Socket.IO
            socket.emit('assistant_message', {
                session_id: sessionId,
                message: message
            });

            // Clear input
            input.value = '';
            input.style.height = 'auto';
        }

        function sendQuickAction(message) {
            document.getElementById('chatInput').value = message;
            sendMessage();
        }

        function addUserMessage(text) {
            const messages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user';
            messageDiv.innerHTML = `<div class="message-content">${escapeHtml(text)}</div>`;
            messages.insertBefore(messageDiv, document.getElementById('typingIndicator'));
            scrollToBottom();
        }

        function addAssistantMessage(data) {
            const messages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message assistant ${data.type || 'info'}`;

            // Parse markdown
            let content = data.markdown || data.text;
            content = marked.parse(content);

            let actionsHtml = '';
            if (data.actions && data.actions.length > 0) {
                actionsHtml = '<div class="message-actions">';
                for (const action of data.actions) {
                    const btnClass = action.action === 'confirm' ? 'confirm' : 'cancel';
                    actionsHtml += `<button class="message-action-btn ${btnClass}" onclick="handleAction('${action.action}')">${action.label}</button>`;
                }
                actionsHtml += '</div>';
            }

            messageDiv.innerHTML = `<div class="message-content">${content}</div>${actionsHtml}`;
            messages.insertBefore(messageDiv, document.getElementById('typingIndicator'));
            scrollToBottom();
        }

        function handleAction(action) {
            if (action === 'confirm') {
                socket.emit('assistant_confirm', { session_id: sessionId });
            } else {
                socket.emit('assistant_cancel', { session_id: sessionId });
            }
        }

        function showTyping() {
            document.getElementById('typingIndicator').classList.add('visible');
            scrollToBottom();
        }

        function hideTyping() {
            document.getElementById('typingIndicator').classList.remove('visible');
        }

        function scrollToBottom() {
            const messages = document.getElementById('chatMessages');
            messages.scrollTop = messages.scrollHeight;
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Voice input (placeholder)
        let isRecording = false;

        function toggleVoice() {
            const btn = document.getElementById('voiceBtn');
            if (!isRecording) {
                btn.classList.add('recording');
                isRecording = true;
                // Would start speech recognition here
                console.log('Voice recording started');
            } else {
                btn.classList.remove('recording');
                isRecording = false;
                // Would stop speech recognition here
                console.log('Voice recording stopped');
            }
        }

        // Initialize marked options
        marked.setOptions({
            breaks: true,
            gfm: true
        });
    </script>
</body>
</html>
