{% extends "base.html" %}
{% block title %}Settings - LEGO Factory v3{% endblock %}
{% block content %}
<h2><i class="bi bi-gear me-2"></i>Settings</h2>
<div class="row">
    <div class="col-md-3">
        <div class="list-group">
            <a href="#" class="list-group-item list-group-item-action active">General</a>
            <a href="#" class="list-group-item list-group-item-action">Notifications</a>
            <a href="#" class="list-group-item list-group-item-action">Security</a>
            <a href="#" class="list-group-item list-group-item-action">API Keys</a>
        </div>
    </div>
    <div class="col-md-9">
        <div class="card">
            <div class="card-header">General Settings</div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Timezone</label>
                    <select class="form-select">
                        <option>America/Los_Angeles (PST)</option>
                        <option>America/New_York (EST)</option>
                        <option selected>UTC</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Date Format</label>
                    <select class="form-select">
                        <option>MM/DD/YYYY</option>
                        <option selected>YYYY-MM-DD</option>
                        <option>DD/MM/YYYY</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Default Dashboard</label>
                    <select class="form-select">
                        <option selected>Home</option>
                        <option>SCADA Overview</option>
                        <option>OEE Dashboard</option>
                    </select>
                </div>
                <hr>
                <h6>Display</h6>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" checked>
                    <label class="form-check-label">Show sidebar by default</label>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox">
                    <label class="form-check-label">Compact mode</label>
                </div>
                <button class="btn btn-primary">Save Settings</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
