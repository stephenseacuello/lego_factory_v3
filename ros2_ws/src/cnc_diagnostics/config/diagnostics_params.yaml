cnc_diagnostics:
  ros__parameters:
    # Diagnostics aggregator settings
    publish_rate: 1.0           # Hz
    sensor_buffer_size: 100     # Samples to keep for variance calculation
    variance_threshold: 10.0    # Trigger alarm above this variance
    heartbeat_timeout: 5.0      # Seconds without data = timeout

sensor_monitor:
  ros__parameters:
    # Sensor monitoring settings
    window_size: 100            # Rolling window for statistics
    noise_threshold: 0.5        # Standard deviation threshold
    drift_threshold: 2.0        # Multiples of baseline std for drift
    timeout_sec: 5.0            # Sensor timeout
    anomaly_z_score: 3.0        # Z-score for anomaly detection

machine_monitor:
  ros__parameters:
    # Machine monitoring settings
    alarm_threshold: 3          # Number of alarms in window
    alarm_window_sec: 300       # Window duration (5 minutes)
    idle_warning_sec: 600       # Idle time warning (10 minutes)
    feed_anomaly_percent: 50    # Feed rate deviation threshold (%)
