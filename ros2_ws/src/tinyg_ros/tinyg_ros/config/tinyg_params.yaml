# TinyG ROS 2 Node Parameters
# ============================

tinyg_node:
  ros__parameters:
    # Serial connection
    port: "/dev/ttyUSB0"
    baudrate: 115200

    # Status polling
    status_rate: 10.0  # Hz

    # Machine identification
    machine_id: "tinyg_001"

    # Simulation mode
    simulate: false

tinyg_simulator:
  ros__parameters:
    machine_id: "tinyg_sim_001"
    publish_rate: 10.0
    motion_speed: 50.0  # mm/s
