mqtt_bridge:
  ros__parameters:
    # MQTT Broker Configuration
    broker_host: "localhost"
    broker_port: 1883
    client_id: "ros2_mqtt_bridge"

    # Authentication (leave empty for no auth)
    username: ""
    password: ""

    # TLS Configuration
    use_tls: false

    # Connection Settings
    reconnect_delay: 5.0  # seconds
    keepalive: 60  # seconds
