; PlatformIO Project Configuration for micro-ROS CNC Sensor Node
; ==============================================================
; Multi-transport support: Serial, WiFi/UDP, WiFi/TCP
;
; Quick Start:
;   pio run -e esp32s3_wifi_udp -t upload    # WiFi UDP (recommended)
;   pio run -e esp32s3_serial -t upload      # USB Serial
;   pio run -e esp32s3_wifi_tcp -t upload    # WiFi TCP
;
; Monitor serial output:
;   pio device monitor -e esp32s3_wifi_udp

; ============================================================================
; Common settings for all environments
; ============================================================================
[platformio]
default_envs = esp32s3_wifi_udp

[common]
monitor_speed = 115200
upload_speed = 921600
lib_deps = https://github.com/micro-ROS/micro_ros_platformio

; ============================================================================
; ESP32-S3 - WiFi UDP Transport (RECOMMENDED)
; ============================================================================
; Use with: docker-compose up -d microros-agent-udp
[env:esp32s3_wifi_udp]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}

lib_deps = ${common.lib_deps}

build_flags =
    -D ESP32S3
    -D TRANSPORT_WIFI_UDP
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

board_build.partitions = min_spiffs.csv
board_build.f_cpu = 240000000L

; ESP32-S3 native USB for upload/monitor
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true

; ============================================================================
; ESP32-S3 - USB Serial Transport
; ============================================================================
; Use with: docker-compose --profile serial up -d
; NOTE: Serial transport uses USB for both data AND micro-ROS communication
;       You won't see debug output while micro-ROS is running
[env:esp32s3_serial]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}

lib_deps = ${common.lib_deps}

build_flags =
    -D ESP32S3
    -D TRANSPORT_SERIAL
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

board_build.partitions = min_spiffs.csv
board_build.f_cpu = 240000000L

board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true

; ============================================================================
; ESP32-S3 - WiFi TCP Transport
; ============================================================================
; Use with: docker-compose --profile tcp up -d
; TCP is more reliable than UDP but slightly higher latency
[env:esp32s3_wifi_tcp]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}

lib_deps = ${common.lib_deps}

build_flags =
    -D ESP32S3
    -D TRANSPORT_WIFI_TCP
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

board_build.partitions = min_spiffs.csv
board_build.f_cpu = 240000000L

board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true

; ============================================================================
; ESP32 DevKit (Classic) - WiFi UDP
; ============================================================================
; For older ESP32 boards without native USB
[env:esp32_wifi_udp]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}

lib_deps = ${common.lib_deps}

build_flags =
    -D ESP32
    -D TRANSPORT_WIFI_UDP
    -D LED_PIN=2

board_build.partitions = min_spiffs.csv
board_build.f_cpu = 240000000L

; ============================================================================
; ESP32 DevKit (Classic) - USB Serial
; ============================================================================
[env:esp32_serial]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}

lib_deps = ${common.lib_deps}

build_flags =
    -D ESP32
    -D TRANSPORT_SERIAL
    -D LED_PIN=2

board_build.partitions = min_spiffs.csv
board_build.f_cpu = 240000000L

; ============================================================================
; Build Commands Reference
; ============================================================================
;
; Build only:
;   pio run -e esp32s3_wifi_udp
;
; Build and upload:
;   pio run -e esp32s3_wifi_udp -t upload
;
; Clean build:
;   pio run -e esp32s3_wifi_udp -t clean
;
; Monitor serial:
;   pio device monitor -e esp32s3_wifi_udp
;
; Build, upload, and monitor:
;   pio run -e esp32s3_wifi_udp -t upload && pio device monitor
;
; List available environments:
;   pio run --list-targets
