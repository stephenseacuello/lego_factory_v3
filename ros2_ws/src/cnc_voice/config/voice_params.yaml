/**:
  ros__parameters:
    # Voice recognition settings
    language: "en-US"
    confidence_threshold: 0.7

    # Default target machine
    default_machine_id: "tinyg_001"

    # Default movement parameters
    default_jog_distance_mm: 10.0
    default_jog_speed_mm_min: 1000.0
    default_spindle_speed_rpm: 12000

    # Safety settings
    max_jog_distance_mm: 100.0
    require_confirmation_for:
      - "emergency_stop"
      - "spindle_on"
      - "coolant_on"

    # Audio feedback
    audio_feedback_enabled: true
    beep_on_command: true
    speak_confirmations: true

    # Wake word (optional)
    wake_word_enabled: false
    wake_word: "hey machine"

    # Command aliases
    aliases:
      "stop": "emergency_stop"
      "halt": "emergency_stop"
      "pause": "feed_hold"
      "resume": "cycle_start"
      "zero": "home"

    # Unit preferences
    default_units: "mm"  # mm or inches
