oee_aggregator:
  ros__parameters:
    # OEE calculation settings
    publish_rate: 1.0           # Hz - how often to publish OEE metrics
    shift_duration_hours: 8.0   # Shift length before counter reset

    # Prometheus metrics
    prometheus_port: 9100       # Port for /metrics endpoint

    # Machines to track (auto-registers additional machines on first message)
    machines:
      - tinyg_sim_001
      - grbl_sim_001

job_simulator:
  ros__parameters:
    machine_id: tinyg_sim_001
    ideal_cycle_time: 60.0      # Target cycle time (seconds)
    cycle_time_variance: 0.15   # +/- 15% variance
    quality_rate: 0.95          # 95% first-pass quality
    jobs_per_hour: 30           # Job frequency
