# Motion Planning Configuration

collision_detector:
  ros__parameters:
    check_rate: 20.0
    warning_distance: 10.0
    stop_distance: 2.0
    enable_limit_checking: true
    enable_obstacle_checking: true

path_planner:
  ros__parameters:
    default_clearance: 5.0
    default_max_velocity: 5000.0
    planning_resolution: 1.0
    optimization_iterations: 100

gcode_validator:
  ros__parameters:
    x_min: 0.0
    x_max: 300.0
    y_min: 0.0
    y_max: 200.0
    z_min: -100.0
    z_max: 0.0
    max_feed_rate: 10000.0
    max_spindle_speed: 24000.0
    require_tool_call: true
    check_rapid_plunge: true
