# GRBL ROS 2 Node Parameters
# ==========================

grbl_node:
  ros__parameters:
    # Serial connection
    port: "/dev/ttyUSB0"  # Linux: /dev/ttyUSB0, /dev/ttyACM0; Mac: /dev/tty.usbserial-*
    baudrate: 115200       # Standard GRBL baud rate

    # Status polling
    status_rate: 10.0      # Hz - how often to query machine status

    # Machine identification
    machine_id: "grbl_001"

    # Simulation mode (set true to run without hardware)
    simulate: false

grbl_simulator:
  ros__parameters:
    machine_id: "grbl_sim_001"
    publish_rate: 10.0     # Hz
    motion_speed: 50.0     # mm/s simulated motion speed
