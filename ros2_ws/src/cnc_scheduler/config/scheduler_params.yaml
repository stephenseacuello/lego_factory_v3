/**:
  ros__parameters:
    # Scheduling strategy
    # Options: balance_load, minimize_lateness, minimize_makespan
    default_strategy: "balance_load"

    # Rebalancing
    rebalance_interval_sec: 60.0
    rebalance_threshold: 0.3  # Trigger if load imbalance > 30%

    # Job queue limits
    max_queue_per_machine: 50
    max_total_jobs: 500

    # Priority levels (1-5, higher = more urgent)
    priority_weights:
      1: 1.0
      2: 1.5
      3: 2.0
      4: 3.0
      5: 5.0

    # Machine capabilities
    machines:
      tinyg_001:
        capabilities: ["milling", "drilling", "engraving"]
        max_spindle_speed: 24000
        max_feed_rate: 5000
        work_envelope: [300, 200, 50]

      grbl_001:
        capabilities: ["milling", "drilling", "routing"]
        max_spindle_speed: 30000
        max_feed_rate: 8000
        work_envelope: [400, 300, 80]

    # Due date handling
    late_penalty_factor: 2.0
    early_completion_bonus: 0.1

    # Status update rate
    status_publish_rate_hz: 1.0
