/**:
  ros__parameters:
    # Safety monitoring intervals
    check_interval_ms: 100

    # Temperature limits (Celsius)
    spindle_temp_warning: 60.0
    spindle_temp_critical: 80.0
    motor_temp_warning: 55.0
    motor_temp_critical: 70.0

    # Machine work envelopes (mm)
    machines:
      tinyg_001:
        x_min: 0.0
        x_max: 300.0
        y_min: 0.0
        y_max: 200.0
        z_min: -50.0
        z_max: 100.0

      grbl_001:
        x_min: 0.0
        x_max: 400.0
        y_min: 0.0
        y_max: 300.0
        z_min: -80.0
        z_max: 50.0

    # Interlock configuration
    door_interlock_enabled: true
    guard_interlock_enabled: true

    # E-stop recovery
    estop_recovery_delay_ms: 2000
    require_manual_reset: true

    # Alarm thresholds
    alarm_publish_rate_hz: 10.0
    heartbeat_timeout_ms: 5000
