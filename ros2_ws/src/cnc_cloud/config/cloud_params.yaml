/**:
  ros__parameters:
    # Site identification
    site_id: "factory_main"
    site_name: "Main Manufacturing Facility"
    site_location: "Building A"

    # Cloud MQTT broker
    cloud_broker_host: "mqtt.example.com"
    cloud_broker_port: 8883
    cloud_broker_use_tls: true

    # Authentication
    cloud_username: ""  # Set via environment: CLOUD_MQTT_USER
    cloud_password: ""  # Set via environment: CLOUD_MQTT_PASS

    # Sync settings
    sync_interval_sec: 5.0
    heartbeat_interval_sec: 30.0

    # What to sync
    sync_machine_status: true
    sync_alarms: true
    sync_production_data: true
    sync_maintenance_data: true
    sync_oee_metrics: true

    # Bandwidth management
    batch_size: 10
    max_queue_size: 1000
    compression_enabled: true

    # Offline handling
    offline_buffer_size: 10000
    retry_interval_sec: 10.0
    max_retries: 5

    # Data retention
    local_retention_hours: 168  # 1 week

    # Multi-site coordination
    coordinate_with_sites: []
    # Example:
    # - "factory_west"
    # - "factory_east"

    # Topic prefixes
    cloud_topic_prefix: "cnc/sites"
    # Results in: cnc/sites/{site_id}/status, cnc/sites/{site_id}/alarms, etc.
