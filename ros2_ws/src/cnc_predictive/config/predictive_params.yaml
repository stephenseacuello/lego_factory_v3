# Predictive Maintenance Configuration

predictive_maintenance_node:
  ros__parameters:
    publish_rate: 1.0
    health_threshold_warning: 0.7
    health_threshold_critical: 0.4
    model_path: ""
    enable_ml_models: true

tool_wear_monitor:
  ros__parameters:
    publish_rate: 0.5
    wear_model: "taylor"  # taylor, empirical, ml

anomaly_detector:
  ros__parameters:
    z_threshold: 3.0
    baseline_samples: 100
    publish_rate: 2.0
    alarm_consecutive_threshold: 5

model_trainer:
  ros__parameters:
    model_output_dir: "/tmp/cnc_models"
    default_epochs: 100
    default_validation_split: 0.2
