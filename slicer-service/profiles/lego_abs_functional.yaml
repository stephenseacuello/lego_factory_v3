# LEGO ABS Functional Profile
# ABS settings matching original LEGO material properties
name: LEGO ABS Functional
material: ABS
description: ABS profile matching LEGO's original material properties

# Layer settings
layer_height: 0.2
first_layer_height: 0.25
wall_thickness: 1.6
top_solid_layers: 5
bottom_solid_layers: 4

# Infill
infill_percentage: 20
infill_pattern: cubic

# Speeds (mm/s)
print_speed: 60
first_layer_speed: 15
travel_speed: 120
infill_speed: 70
wall_speed: 45
top_speed: 35

# Temperatures
nozzle_temperature: 245
bed_temperature: 100
first_layer_nozzle_temp: 250
first_layer_bed_temp: 105
enclosure_temperature: 45

# Retraction
retraction_enabled: true
retraction_distance: 4.0
retraction_speed: 40
retraction_z_hop: 0.3

# Adhesion
brim_width: 5
skirt_loops: 3

# Support
support_enabled: false

# Cooling
fan_speed: 30
fan_speed_min: 0
min_layer_time: 15

# ABS-specific
draft_shield: true
ooze_shield: true
