# LEGO PETG Durable Profile
# PETG settings for durable, functional LEGO parts
name: LEGO PETG Durable
material: PETG
description: PETG profile for durable functional parts

# Layer settings
layer_height: 0.2
first_layer_height: 0.25
wall_thickness: 1.6
top_solid_layers: 5
bottom_solid_layers: 5

# Infill
infill_percentage: 30
infill_pattern: gyroid

# Speeds (mm/s)
print_speed: 55
first_layer_speed: 15
travel_speed: 120
infill_speed: 60
wall_speed: 40
top_speed: 30

# Temperatures
nozzle_temperature: 240
bed_temperature: 80
first_layer_nozzle_temp: 245
first_layer_bed_temp: 85

# Retraction
retraction_enabled: true
retraction_distance: 6.0
retraction_speed: 35
retraction_z_hop: 0.2
retraction_extra_prime: 0.1

# Adhesion
brim_width: 4
skirt_loops: 2

# Support
support_enabled: false

# Cooling
fan_speed: 70
fan_speed_min: 30
min_layer_time: 12

# PETG-specific
coasting_enabled: true
coasting_volume: 0.08
