# LEGO PLA Quality Profile
# High-quality settings for printing LEGO-compatible bricks
name: LEGO PLA Quality
material: PLA
description: High-quality profile for LEGO bricks with tight tolerances

# Layer settings
layer_height: 0.12
first_layer_height: 0.2
wall_thickness: 1.2
top_solid_layers: 5
bottom_solid_layers: 4

# Infill
infill_percentage: 25
infill_pattern: grid

# Speeds (mm/s)
print_speed: 50
first_layer_speed: 20
travel_speed: 150
infill_speed: 60
wall_speed: 40
top_speed: 30

# Temperatures
nozzle_temperature: 205
bed_temperature: 60
first_layer_nozzle_temp: 210
first_layer_bed_temp: 65

# Retraction
retraction_enabled: true
retraction_distance: 5.0
retraction_speed: 45
retraction_z_hop: 0.2

# Adhesion
brim_width: 3
skirt_loops: 2

# Support
support_enabled: false

# Cooling
fan_speed: 100
fan_speed_min: 50
min_layer_time: 10

# Quality
seam_position: rear
fuzzy_skin: false
ironing: false
